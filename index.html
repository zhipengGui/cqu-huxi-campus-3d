<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>重庆大学虎溪校区 3D 地图</title>
  <style>
    :root {
      --panel-bg: rgba(255, 255, 255, 0.88);
      --text: #333;
      --muted: #888;
      --line: rgba(0, 0, 0, 0.08);
      --pill-bg: rgba(255, 255, 255, 0.92);
      --pill-text: #3a4a5c;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, "Microsoft YaHei", sans-serif; color: var(--text); }
    body.night {
      --panel-bg: rgba(18, 26, 42, 0.88);
      --text: #d5e2f5;
      --muted: #7a8aa5;
      --line: rgba(255, 255, 255, 0.12);
      --pill-bg: rgba(22, 32, 52, 0.85);
      --pill-text: #a9c2e8;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }

    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: var(--panel-bg); backdrop-filter: blur(8px);
      border-radius: 12px; width: 272px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.18);
      font-size: 13px; line-height: 1.6;
      display: flex; flex-direction: column;
      max-height: calc(100vh - 24px);
    }
    #hud-head {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 14px 9px;
    }
    #hud-head .title { font-weight: 700; font-size: 15px; flex: 1; }
    #hud-fold {
      border: none; background: rgba(127, 127, 127, 0.1); color: var(--muted);
      width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    #hud.collapsed #hud-fold { transform: rotate(-90deg); }
    #hud.collapsed #hud-body { display: none; }
    #hud-body {
      display: flex; flex-direction: column; min-height: 0;
      padding: 0 14px 11px;
    }
    #hud .muted { color: var(--muted); font-size: 12px; }
    #hud .err { color: #d24a4a; }
    #hud-stats { margin-top: 8px; flex: none; }

    #places {
      flex: 1 1 auto; min-height: 120px; overflow-y: auto;
      margin: 8px -6px 0; padding: 0 6px;
      scrollbar-width: thin;
    }
    #places::-webkit-scrollbar { width: 6px; }
    #places::-webkit-scrollbar-thumb { background: rgba(127, 127, 127, 0.3); border-radius: 3px; }
    .place-group { border-bottom: 1px solid var(--line); }
    .place-group:last-child { border-bottom: none; }
    .pg-head {
      display: flex; width: 100%; align-items: center; justify-content: space-between;
      padding: 7px 4px; border: none; background: none; cursor: pointer;
      font-size: 12px; font-weight: 700; color: var(--text); text-align: left;
    }
    .pg-head .cnt { color: var(--muted); font-weight: 400; }
    .pg-head::after { content: "▾"; color: var(--muted); font-size: 10px; margin-left: 6px; }
    .place-group.folded .pg-head::after { content: "▸"; }
    .place-group.folded .pg-body { display: none; }
    .pg-body { padding-bottom: 4px; }
    .place {
      display: flex; width: 100%; align-items: center; gap: 8px;
      padding: 6px 8px; border: none; border-radius: 7px; background: none;
      color: var(--text); font-size: 13px; cursor: pointer; text-align: left;
    }
    .place:hover { background: rgba(127, 160, 200, 0.15); }
    .place.active { background: rgba(90, 140, 200, 0.28); }
    .place .num { color: var(--muted); font-size: 12px; width: 20px; flex: none; }
    .place .nm { flex: 1; }
    .place .badge {
      flex: none; font-size: 11px; padding: 0 5px; border-radius: 4px;
      background: rgba(127, 160, 200, 0.25); color: var(--text);
    }
    .place .chev { color: var(--muted); flex: none; }

    #search-wrap { position: relative; margin: 8px 0 2px; }
    #search {
      width: 100%; box-sizing: border-box; padding: 7px 10px;
      border: 1px solid var(--line); border-radius: 8px;
      font-size: 13px; background: rgba(127, 127, 127, 0.08); color: var(--text); outline: none;
    }
    #search:focus { border-color: #7ba7d7; }
    #suggestions {
      display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
      background: var(--panel-bg); border-radius: 8px; margin-top: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2); overflow: hidden;
    }
    #suggestions.open { display: block; }
    .suggestion {
      display: block; width: 100%; text-align: left; padding: 7px 10px;
      border: none; background: none; color: var(--text); font-size: 13px; cursor: pointer;
    }
    .suggestion:hover, .suggestion.first { background: rgba(127, 160, 200, 0.18); }
    .suggestion .tag {
      display: inline-block; font-size: 11px; padding: 0 5px; margin-right: 6px;
      border-radius: 4px; background: rgba(127, 160, 200, 0.25); color: var(--text);
    }

    #nav-panel {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 10;
      background: var(--panel-bg); backdrop-filter: blur(8px);
      border-radius: 12px; padding: 10px 14px; display: none;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.2); font-size: 13px; color: var(--text);
      text-align: center;
    }
    #nav-panel.open { display: block; }
    #nav-status { font-weight: 600; margin-bottom: 8px; min-width: 200px; }
    #nav-actions { display: flex; gap: 8px; justify-content: center; }
    #nav-actions button {
      padding: 5px 14px; border: 1px solid var(--line); border-radius: 7px;
      background: rgba(127, 127, 127, 0.08); color: var(--text); font-size: 12px; cursor: pointer;
    }
    #nav-actions button:hover { background: rgba(90, 140, 200, 0.2); }

    .map-label.gate { color: #2e7d43; background: rgba(232, 246, 236, 0.9); }
    body.night .map-label.gate { color: #8fd6a5; background: rgba(16, 42, 28, 0.85); }

    #toolbar { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .tb {
      padding: 4px 10px; border: 1px solid var(--line); border-radius: 7px;
      background: rgba(127, 127, 127, 0.08); color: var(--muted); font-size: 12px; cursor: pointer;
    }
    .tb.on { color: var(--text); background: rgba(90, 140, 200, 0.22); border-color: rgba(90, 140, 200, 0.5); }
    .seg { display: flex; gap: 4px; }

    #info-card {
      position: fixed; top: 12px; right: 12px; z-index: 10; width: 250px;
      background: var(--panel-bg); backdrop-filter: blur(8px);
      border-radius: 12px; padding: 12px 14px; display: none;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.18); font-size: 13px; line-height: 1.7;
    }
    #info-card.open { display: block; }
    #ic-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; padding-right: 20px; }
    #info-card .row { display: flex; gap: 8px; }
    #info-card .k { color: var(--muted); flex: none; width: 34px; }
    #ic-src { font-size: 12px; color: var(--muted); }
    #ic-src.calibrating { color: #b8863b; }
    #ic-actions { display: flex; gap: 8px; margin-top: 8px; }
    #ic-actions button {
      flex: 1; padding: 5px 0; border: 1px solid var(--line); border-radius: 7px;
      background: rgba(127, 127, 127, 0.08); color: var(--text); font-size: 12px; cursor: pointer;
    }
    #ic-actions button:hover { background: rgba(90, 140, 200, 0.2); }

    .map-label {
      padding: 1px 7px; border-radius: 6px; font-size: 12px; white-space: nowrap;
      background: var(--pill-bg); color: var(--pill-text);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.18); cursor: pointer; user-select: none;
    }
    .map-label.water { color: #2a6f9e; background: rgba(230, 244, 252, 0.88); }
    body.night .map-label.water { color: #8ec7ee; background: rgba(18, 40, 60, 0.85); }
    .map-label:hover { background: rgba(255, 220, 140, 0.95); color: #333; }

    @media (max-width: 640px) {
      #hud { width: auto; right: 12px; max-height: 62vh; }
      #hud-head { padding: 9px 12px 7px; }
      #hud-body { padding: 0 12px 9px; }
      #hud .title { font-size: 14px; }
      .hint { display: none; }
      #info-card {
        top: auto; bottom: 12px; left: 12px; right: 12px; width: auto;
      }
      .map-label { font-size: 11px; padding: 1px 6px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div id="hud-head">
      <span class="title">校园浏览</span>
      <span id="hud-count" class="muted"></span>
      <button id="hud-fold" type="button" title="收起/展开">▾</button>
    </div>
    <div id="hud-body">
      <div id="search-wrap">
        <input id="search" placeholder="搜索楼栋 / 湖泊 / 校门" autocomplete="off" />
        <div id="suggestions"></div>
      </div>
      <div id="toolbar">
        <div class="seg">
          <button id="tb-labels" class="tb on" type="button">标注</button>
          <button id="tb-nav" class="tb" type="button">导航</button>
        </div>
        <div class="seg">
          <button id="preset-day" class="tb on" type="button">昼</button>
          <button id="preset-dusk" class="tb" type="button">昏</button>
          <button id="preset-night" class="tb" type="button">夜</button>
        </div>
      </div>
      <div id="places"></div>
      <div id="hud-stats" class="muted">正在加载场景数据…</div>
      <div class="muted hint">左键旋转 · 滚轮缩放 · 右键平移 · 点楼看信息</div>
    </div>
  </div>
  <div id="nav-panel">
    <div id="nav-status">点击道路或地面设置起点</div>
    <div id="nav-actions">
      <button id="nav-clear" type="button">清除路线</button>
      <button id="nav-exit" type="button">退出导航</button>
    </div>
  </div>
  <div id="info-card">
    <div id="ic-title"></div>
    <div class="row"><span class="k">类型</span><span id="ic-type"></span></div>
    <div class="row"><span class="k">高度</span><span id="ic-height"></span></div>
    <div class="row"><span class="k">占地</span><span id="ic-area"></span></div>
    <div class="row"><span class="k">来源</span><span id="ic-src"></span></div>
    <div id="ic-actions">
      <button id="ic-fly" type="button">镜头定位</button>
      <button id="ic-close" type="button">关闭</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
